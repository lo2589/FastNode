[package]
name = "fastnode"
version = "0.1.0"
edition = "2024"
description = "Transactional JSON nodes with bitmap predicates and graph traversal"
license = "MIT"

[dependencies]
anyhow = "1"
roaring = "0.11"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[profile.release]
lto = "thin"

